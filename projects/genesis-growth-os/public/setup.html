<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>初始化 · Genesis AI</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
  <link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0c0d0f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Genesis"><meta name="apple-mobile-web-app-status-bar-style" content="black"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <!-- Same three sheets the app loads — see the note in login.html. -->
  <link rel="stylesheet" href="css/01-tokens.css?v=6" />
  <link rel="stylesheet" href="css/02-base.css?v=5" />
  <link rel="stylesheet" href="css/03-components.css?v=10" />
  <style>
    body { display: grid; place-items: center; }
    .setup-box { width: 100%; max-width: 440px; padding: 40px; text-align: center; }
    .setup-box h1 { font-size: 32px; margin-bottom: 12px; background: none; -webkit-text-fill-color: var(--text); }
    .setup-box p { color: var(--text-dim); margin: 0 0 24px; line-height: 1.5; }
    .setup-box input { margin-bottom: 12px; text-align: center; font-size: 18px; }
    .setup-box button { width: 100%; padding: 14px; font-size: 16px; }
    .error { color: var(--red); font-size: 14px; margin-top: 16px; display: none; }
  </style>
</head>
<body>
  <div class="setup-box glass">
    <div class="brand" style="justify-content: center; margin-bottom: 16px;"><span class="brand-mark lg" aria-hidden="true"><svg viewBox="0 0 192 192"><path d="M22 80 L62 64 L62 96 Z"/><rect x="54" y="56" width="118" height="28" rx="8"/><path d="M86 84 H142 L124 120 H100 Z"/><path d="M60 120 H160 L178 156 H42 Z"/></svg></span><span>Genesis AI（新生）</span></div>
    <h1>设置我的密码</h1>
    <p id="setupHint">用你自己的密码保护成长空间。密码不会以明文保存。</p>
    <form id="setupForm">
      <input type="password" id="password" placeholder="输入你的密码" aria-label="新密码" required autofocus autocomplete="new-password">
      <input type="password" id="confirmPassword" placeholder="再次输入密码" aria-label="确认新密码" required autocomplete="new-password">
      <button type="submit" class="primary">完成设置</button>
      <div class="error" id="errorMsg"></div>
    </form>
  </div>

  <script src="setup.js?v=2"></script>
  <script defer src="/genesis-pwa.js?v=1"></script>
</body>
</html>
